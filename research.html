<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research | ProtiQ Nexus</title>
  <style>
    body { margin:0; background:#080d19; color:#f2f6ff; font-family:Arial,sans-serif; }
    a { color:inherit; text-decoration:none; }
    header { border-bottom:1px solid #24334a; }
    nav { max-width:1100px; margin:auto; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; }
    .logo { font-weight:800; } .logo span { color:#54ead5; }
    .navlinks a { color:#a1b0c8; margin-left:14px; font-size:13px; }
    .navlinks a.active { color:#54ead5; }
    .wrap { max-width:900px; margin:auto; padding:40px 20px; }
    .tabs { display:flex; gap:10px; margin:16px 0; }
    .tab { padding:10px 16px; border-radius:9px; border:1px solid #24334a; background:transparent; color:#a1b0c8; cursor:pointer; }
    .tab.active { border-color:#54ead5; color:#54ead5; }
    .panel { display:none; } .panel.active { display:block; }
    .card { background:#101a2b; border:1px solid #24334a; border-radius:14px; padding:20px; margin-bottom:12px; }
    label { display:block; font-size:13px; color:#a1b0c8; margin-bottom:6px; }
    input, textarea { width:100%; box-sizing:border-box; padding:11px; margin-bottom:12px; border:1px solid #24334a; border-radius:9px; background:#0a1120; color:#fff; }
    textarea { min-height:90px; }
    .btn { padding:11px 18px; border:0; border-radius:9px; cursor:pointer; background:linear-gradient(100deg,#347cf0,#24b8b0); color:#06101b; font-weight:800; }
    .msg { margin-top:10px; color:#54ead5; font-size:14px; }
    .err { color:#ff6b6b; }
    #info { color:#a1b0c8; }
    .meta { color:#a1b0c8; font-size:13px; }
    .links a { color:#65aaff; font-size:13px; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a class="logo" href="/">ProtiQ<span> Labs</span></a>
      <div class="navlinks">
        <a href="/">Home</a>
        <a href="/olympiad.html">Olympiad</a>
        <a href="/research.html" class="active">Research</a>
        <a href="/ai.html">AI</a>
        <a href="/profile.html">Profile</a>
      </div>
    </nav>
  </header>

  <div class="wrap">
    <div id="info">Checking login...</div>
    <div id="app" style="display:none">
      <h1>Research Hub</h1>
      <div class="tabs">
        <button class="tab active" type="button" onclick="showList()">Browse Papers</button>
        <button class="tab" type="button" onclick="showUpload()">Upload Paper</button>
      </div>

      <div id="listPanel" class="panel active">
        <div id="paperList">Loading...</div>
      </div>

      <div id="uploadPanel" class="panel">
        <div class="card">
          <label>Title *</label>
          <input id="title" maxlength="200">
          <label>Authors *</label>
          <input id="authors" maxlength="300">
          <label>Subject</label>
          <input id="subject" maxlength="100">
          <label>DOI</label>
          <input id="doi" maxlength="150" placeholder="10.1234/example">
          <label>Abstract</label>
          <textarea id="abstract" maxlength="5000"></textarea>
          <label>PDF File * (max 10MB)</label>
          <input id="file" type="file" accept="application/pdf">
          <button class="btn" type="button" onclick="uploadPaper()">Upload Research</button>
          <div class="msg" id="msg"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const info = document.getElementById("info");
    const sb = window.supabase.createClient(
      "https://dylkrvdnyefdeuxtchji.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5bGtydmRueWVmZGV1eHRjaGppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1ODgxNjEsImV4cCI6MjEwODE2NDE2MX0.cs0XsVKkoo61FwJMitjSGx3vdmYsfWpqovl7kTfgAp4"
    );

    function showList() {
      document.getElementById("listPanel").classList.add("active");
      document.getElementById("uploadPanel").classList.remove("active");
    }
    function showUpload() {
      document.getElementById("uploadPanel").classList.add("active");
      document.getElementById("listPanel").classList.remove("active");
    }

    function esc(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    async function loadPapers() {
      var box = document.getElementById("paperList");
      try {
        var res = await fetch("/api/research-list");
        var data = await res.json();
        var papers = data.papers || [];
        if (!papers.length) {
          box.innerHTML = "<p style='color:#a1b0c8'>No papers yet.</p>";
          return;
        }
        box.innerHTML = papers.map(function(p) {
          return '<div class="card"><h3>' + esc(p.title) + '</h3>' +
            '<div class="meta">' + esc(p.authors) + (p.subject ? " · " + esc(p.subject) : "") + (p.doi ? " · DOI: " + esc(p.doi) : "") + '</div>' +
            (p.abstract ? '<p class="meta">' + esc(p.abstract) + '</p>' : '') +
            (p.doi ? '<div class="links"><a href="https://doi.org/' + encodeURIComponent(p.doi) + '" target="_blank">View DOI</a></div>' : '') +
            '</div>';
        }).join("");
      } catch (e) {
        box.innerHTML = "<p class='err'>Could not load papers</p>";
      }
    }

    async function uploadPaper() {
      var msg = document.getElementById("msg");
      msg.className = "msg";
      msg.textContent = "Uploading...";
      try {
        var fd = new FormData();
        fd.append("title", document.getElementById("title").value.trim());
        fd.append("authors", document.getElementById("authors").value.trim());
        fd.append("subject", document.getElementById("subject").value.trim());
        fd.append("doi", document.getElementById("doi").value.trim());
        fd.append("abstract", document.getElementById("abstract").value.trim());
        var file = document.getElementById("file").files[0];
        if (!file) throw new Error("PDF select koro");
        fd.append("file", file);
        var res = await fetch("/api/research", { method: "POST", body: fd });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error || "Upload failed");
        msg.textContent = data.message || "Uploaded!";
        loadPapers();
        showList();
      } catch (e) {
        msg.className = "msg err";
        msg.textContent = e.message || String(e);
      }
    }

    (async function () {
      try {
        var { data: { session }, error } = await sb.auth.getSession();
        if (error) { info.textContent = "Auth error: " + error.message; return; }
        if (!session) {
          info.textContent = "Not logged in. Redirecting...";
          window.location.href = "/login.html";
          return;
        }
        info.style.display = "none";
        document.getElementById("app").style.display = "block";
        loadPapers();
      } catch (e) {
        info.textContent = "Error: " + (e.message || e);
      }
    })();
  </script>
</body>
</html>
