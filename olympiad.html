<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olympiad | ProtiQ Nexus</title>
  <link rel="icon" href="/logo.png" type="image/png">
  <style>
    :root {
      --bg:#080d19; --panel:#101a2b; --text:#f2f6ff; --muted:#a1b0c8;
      --blue:#65aaff; --cyan:#54ead5; --border:#24334a;
      --success:#3dd68c; --danger:#ff6b6b;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Arial,sans-serif; line-height:1.65; }
    a { color:inherit; text-decoration:none; }
    header { border-bottom:1px solid var(--border); }
    nav { max-width:1000px; margin:auto; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; }
    .brand img { width:36px; height:36px; border-radius:50%; }
    .brand span { color:var(--cyan); }
    .navlinks a { color:var(--muted); margin-left:12px; font-size:13px; }
    .navlinks a.active { color:var(--cyan); }
    .wrap { max-width:900px; margin:auto; padding:28px 20px; }
    .tabs { display:flex; gap:8px; margin:16px 0; flex-wrap:wrap; }
    .tab { padding:10px 14px; border-radius:9px; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; }
    .tab.active { border-color:var(--cyan); color:var(--cyan); }
    .panel { display:none; } .panel.active { display:block; }
    .filters { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
    .filter-btn, .topic-btn {
      padding:8px 12px; border-radius:999px; border:1px solid var(--border);
      background:transparent; color:var(--muted); cursor:pointer;
    }
    .filter-btn.active, .topic-btn.active { border-color:var(--cyan); color:var(--cyan); }
    .q-card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:12px; }
    .tag { padding:3px 10px; border-radius:999px; background:rgba(101,170,255,.12); color:var(--blue); font-size:12px; margin-right:6px; }
    .option { padding:10px 12px; border:1px solid var(--border); border-radius:10px; margin:6px 0; background:#0a1120; cursor:pointer; }
    .option.correct { border-color:var(--success); color:var(--success); }
    .option.wrong { border-color:var(--danger); color:var(--danger); }
    .option.selected { border-color:var(--cyan); }
    .btn {
      padding:10px 16px; border:0; border-radius:9px; cursor:pointer;
      background:linear-gradient(100deg,#347cf0,#24b8b0); color:#06101b; font-weight:800;
    }
    .btn2 { background:transparent; border:1px solid var(--border); color:var(--text); }
    #info { color:var(--muted); }
    .msg { margin-top:12px; color:var(--cyan); }
    .err { color:var(--danger); }
    .lb-row {
      display:flex; justify-content:space-between; padding:12px 14px;
      border:1px solid var(--border); border-radius:10px; margin-bottom:8px; background:var(--panel);
    }
    .meta { color:var(--muted); font-size:13px; margin-bottom:12px; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a class="brand" href="/"><img src="/logo.png" alt=""> ProtiQ<span> Nexus</span></a>
      <div class="navlinks">
        <a href="/">Home</a>
        <a href="/olympiad.html" class="active">Olympiad</a>
        <a href="/research.html">Research</a>
        <a href="/ai.html">AI</a>
        <a href="/profile.html">Profile</a>
      </div>
    </nav>
  </header>

  <div class="wrap">
    <div id="info">Checking login...</div>
    <div id="app" style="display:none">
      <h1>Olympiad</h1>
      <div class="tabs">
        <button class="tab active" type="button" onclick="showPanel('practice')">Practice Mode</button>
        <button class="tab" type="button" onclick="showPanel('browse')">Browse All</button>
        <button class="tab" type="button" onclick="showPanel('board')">Leaderboard</button>
      </div>

      <!-- PRACTICE -->
      <div id="practice" class="panel active">
        <p class="meta">Each part has 10 questions. Score ≥ 7/10 to unlock the next harder part. Points go to leaderboard.</p>
        <div class="filters" id="practiceTopics">
          <button class="topic-btn active" data-topic="Mechanics">Mechanics</button>
          <button class="topic-btn" data-topic="Electricity">Electricity</button>
          <button class="topic-btn" data-topic="Optics">Optics</button>
          <button class="topic-btn" data-topic="Thermodynamics">Thermodynamics</button>
          <button class="topic-btn" data-topic="Modern Physics">Modern Physics</button>
        </div>
        <div class="meta" id="partInfo">Part 1 · Beginner</div>
        <button class="btn" type="button" id="startBtn">Start Part</button>
        <div id="quizBox" style="margin-top:16px"></div>
        <div class="msg" id="quizMsg"></div>
      </div>

      <!-- BROWSE -->
      <div id="browse" class="panel">
        <div class="filters" id="topicFilters">
          <button class="filter-btn active" data-topic="all">All Topics</button>
          <button class="filter-btn" data-topic="Mechanics">Mechanics</button>
          <button class="filter-btn" data-topic="Electricity">Electricity</button>
          <button class="filter-btn" data-topic="Optics">Optics</button>
          <button class="filter-btn" data-topic="Thermodynamics">Thermodynamics</button>
          <button class="filter-btn" data-topic="Modern Physics">Modern Physics</button>
        </div>
        <div class="filters" id="levelFilters">
          <button class="filter-btn active" data-level="all">All Levels</button>
          <button class="filter-btn" data-level="Beginner">Beginner</button>
          <button class="filter-btn" data-level="Intermediate">Intermediate</button>
          <button class="filter-btn" data-level="Advanced">Advanced</button>
        </div>
        <div id="questionList">Loading...</div>
      </div>

      <!-- LEADERBOARD -->
      <div id="board" class="panel">
        <p class="meta">Top scores</p>
        <div id="leaderList">Loading...</div>
        <button class="btn btn2" type="button" onclick="loadBoard()">Refresh</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = window.supabase.createClient(
      "https://dylkrvdnyefdeuxtchji.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5bGtydmRueWVmZGV1eHRjaGppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1ODgxNjEsImV4cCI6MjEwODE2NDE2MX0.cs0XsVKkoo61FwJMitjSGx3vdmYsfWpqovl7kTfgAp4"
    );

    let userEmail = "";
    let practiceTopic = "Mechanics";
    let currentPart = 1;
    let quizQuestions = [];
    let selected = {};
    let allQuestions = [];
    let currentTopic = "all";
    let currentLevel = "all";

    function showPanel(id) {
      ["practice", "browse", "board"].forEach(function (p) {
        document.getElementById(p).classList.toggle("active", p === id);
      });
      document.querySelectorAll(".tabs .tab").forEach(function (t, i) {
        t.classList.toggle("active", ["practice", "browse", "board"][i] === id);
      });
      if (id === "board") loadBoard();
      if (id === "browse") loadBrowse();
    }

    document.getElementById("practiceTopics").onclick = function (e) {
      if (!e.target.classList.contains("topic-btn")) return;
      document.querySelectorAll(".topic-btn").forEach(function (b) { b.classList.remove("active"); });
      e.target.classList.add("active");
      practiceTopic = e.target.getAttribute("data-topic");
      currentPart = 1;
      document.getElementById("partInfo").textContent = "Part 1 · Beginner";
      document.getElementById("quizBox").innerHTML = "";
      document.getElementById("quizMsg").textContent = "";
    };

    document.getElementById("startBtn").onclick = startQuiz;

    async function startQuiz() {
      const box = document.getElementById("quizBox");
      const msg = document.getElementById("quizMsg");
      msg.textContent = "";
      box.innerHTML = "Loading 10 questions...";
      selected = {};
      try {
        const res = await fetch("/api/quiz?topic=" + encodeURIComponent(practiceTopic) + "&part=" + currentPart);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed");
        quizQuestions = data.questions || [];
        document.getElementById("partInfo").textContent = "Part " + data.part + " · " + data.level;
        if (!quizQuestions.length) {
          box.innerHTML = "<p>Not enough questions for this part. Add more in D1.</p>";
          return;
        }
        box.innerHTML = quizQuestions.map(function (q, i) {
          const opts = (q.options || []).map(function (opt) {
            return '<div class="option" data-qid="' + q.id + '" data-opt="' + encodeURIComponent(String(opt)) + '">' + opt + '</div>';
          }).join("");
          return '<div class="q-card"><div><span class="tag">' + q.topic + '</span><span class="tag">' + q.level + '</span></div>' +
            '<p><b>' + (i + 1) + '.</b> ' + q.question + '</p>' + opts + '</div>';
        }).join("") + '<button class="btn" type="button" id="submitQuiz">Submit answers</button>';

        box.onclick = function (e) {
          const el = e.target.closest(".option");
          if (!el) return;
          const qid = el.getAttribute("data-qid");
          box.querySelectorAll('.option[data-qid="' + qid + '"]').forEach(function (o) { o.classList.remove("selected"); });
          el.classList.add("selected");
          selected[qid] = decodeURIComponent(el.getAttribute("data-opt"));
        };
        document.getElementById("submitQuiz").onclick = submitQuiz;
      } catch (e) {
        box.innerHTML = "";
        msg.className = "msg err";
        msg.textContent = e.message || String(e);
      }
    }

    async function submitQuiz() {
      const msg = document.getElementById("quizMsg");
      let correct = 0;
      quizQuestions.forEach(function (q) {
        const cardOpts = document.querySelectorAll('.option[data-qid="' + q.id + '"]');
        cardOpts.forEach(function (o) {
          o.style.pointerEvents = "none";
          const val = decodeURIComponent(o.getAttribute("data-opt"));
          if (val === q.correct_answer) o.classList.add("correct");
        });
        if (selected[q.id] === q.correct_answer) correct++;
        else if (selected[q.id]) {
          document.querySelectorAll('.option[data-qid="' + q.id + '"]').forEach(function (o) {
            if (decodeURIComponent(o.getAttribute("data-opt")) === selected[q.id]) o.classList.add("wrong");
          });
        }
      });

      try {
        const res = await fetch("/api/quiz", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: userEmail,
            topic: practiceTopic,
            part: currentPart,
            correct: correct,
            total: quizQuestions.length
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Save failed");
        msg.className = "msg";
        msg.textContent = "Score: " + correct + "/" + quizQuestions.length + " · +" + data.earned + " points. " + data.message;
        if (data.unlockedNext) {
          currentPart = data.nextPart;
          document.getElementById("partInfo").textContent = "Unlocked Part " + currentPart;
        }
      } catch (e) {
        msg.className = "msg err";
        msg.textContent = "Score: " + correct + "/" + quizQuestions.length + " (save error: " + (e.message || e) + ")";
      }
    }

    async function loadBrowse() {
      const list = document.getElementById("questionList");
      try {
        const res = await fetch("/api/questions");
        const data = await res.json();
        allQuestions = data.questions || [];
        renderBrowse();
      } catch (e) {
        list.textContent = "Could not load questions.";
      }
    }

    function renderBrowse() {
      const list = document.getElementById("questionList");
      let filtered = allQuestions;
      if (currentTopic !== "all") filtered = filtered.filter(function (q) { return q.topic === currentTopic; });
      if (currentLevel !== "all") filtered = filtered.filter(function (q) { return q.level === currentLevel; });
      if (!filtered.length) { list.innerHTML = "<p>No questions.</p>"; return; }
      list.innerHTML = filtered.slice(0, 50).map(function (q, idx) {
        let options = [];
        try { options = typeof q.options === "string" ? JSON.parse(q.options) : (q.options || []); } catch (e) {}
        const opts = options.map(function (opt) {
          return '<div class="option">' + opt + '</div>';
        }).join("");
        return '<div class="q-card"><div><span class="tag">' + q.topic + '</span><span class="tag">' + q.level + '</span></div>' +
          '<p><b>' + (idx + 1) + '.</b> ' + q.question + '</p>' + opts +
          '<p class="meta"><b>Answer:</b> ' + q.correct_answer + '</p></div>';
      }).join("");
    }

    document.getElementById("topicFilters").onclick = function (e) {
      if (!e.target.classList.contains("filter-btn")) return;
      document.querySelectorAll("#topicFilters .filter-btn").forEach(function (b) { b.classList.remove("active"); });
      e.target.classList.add("active");
      currentTopic = e.target.getAttribute("data-topic");
      renderBrowse();
    };
    document.getElementById("levelFilters").onclick = function (e) {
      if (!e.target.classList.contains("filter-btn")) return;
      document.querySelectorAll("#levelFilters .filter-btn").forEach(function (b) { b.classList.remove("active"); });
      e.target.classList.add("active");
      currentLevel = e.target.getAttribute("data-level");
      renderBrowse();
    };

    async function loadBoard() {
      const box = document.getElementById("leaderList");
      box.textContent = "Loading...";
      try {
        const res = await fetch("/api/leaderboard");
        const data = await res.json();
        const leaders = data.leaders || [];
        if (!leaders.length) { box.innerHTML = "<p class='meta'>No scores yet. Complete a practice part!</p>"; return; }
        box.innerHTML = leaders.map(function (r, i) {
          return '<div class="lb-row"><span>#' + (i + 1) + ' ' + (r.display_name || r.user_email) + '</span><span>' + r.total_points + ' pts</span></div>';
        }).join("");
      } catch (e) {
        box.innerHTML = "<p class='err'>Could not load leaderboard</p>";
      }
    }

    (async function () {
      const info = document.getElementById("info");
      try {
        const { data: { session }, error } = await sb.auth.getSession();
        if (error) { info.textContent = "Auth error: " + error.message; return; }
        if (!session) {
          info.textContent = "Not logged in. Redirecting...";
          window.location.href = "/login.html";
          return;
        }
        userEmail = session.user.email || "";
        info.style.display = "none";
        document.getElementById("app").style.display = "block";
      } catch (e) {
        info.textContent = "Error: " + (e.message || e);
      }
    })();
  </script>
</body>
</html>
