<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olympiad | ProtiQ Nexus</title>
  <style>
    :root {
      --bg:#080d19; --panel:#101a2b; --text:#f2f6ff; --muted:#a1b0c8;
      --blue:#65aaff; --cyan:#54ead5; --border:#24334a;
      --success:#3dd68c; --danger:#ff6b6b;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Arial,sans-serif; line-height:1.65; }
    a { color:inherit; text-decoration:none; }
    button { font:inherit; cursor:pointer; }
    header { border-bottom:1px solid var(--border); }
    nav { max-width:1100px; margin:auto; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; }
    .logo { font-weight:800; } .logo span { color:var(--cyan); }
    .navlinks a { color:var(--muted); margin-left:14px; font-size:13px; }
    .navlinks a.active { color:var(--cyan); }
    .wrap { max-width:900px; margin:auto; padding:40px 20px; }
    .filters { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0; }
    .filter-btn { padding:8px 14px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--muted); }
    .filter-btn.active { border-color:var(--cyan); color:var(--cyan); }
    .q-card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:14px; }
    .tag { padding:3px 10px; border-radius:999px; background:rgba(101,170,255,.12); color:var(--blue); font-size:12px; margin-right:6px; }
    .tag.level { background:rgba(84,234,213,.12); color:var(--cyan); }
    .option { padding:10px 13px; border:1px solid var(--border); border-radius:10px; margin:6px 0; background:#0a1120; cursor:pointer; }
    .option.correct { border-color:var(--success); color:var(--success); }
    .option.wrong { border-color:var(--danger); color:var(--danger); }
    .btn { padding:9px 14px; border:1px solid var(--border); border-radius:9px; background:transparent; color:var(--text); }
    .explanation { margin-top:12px; padding:12px; border-radius:10px; background:rgba(84,234,213,.07); color:var(--muted); font-size:14px; display:none; }
    .explanation.show { display:block; }
    #info { color:var(--muted); padding:20px 0; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a class="logo" href="/">ProtiQ<span> Labs</span></a>
      <div class="navlinks">
        <a href="/">Home</a>
        <a href="/olympiad.html" class="active">Olympiad</a>
        <a href="/research.html">Research</a>
        <a href="/ai.html">AI</a>
        <a href="/profile.html">Profile</a>
      </div>
    </nav>
  </header>

  <div class="wrap">
    <div id="info">Checking login...</div>
    <div id="app" style="display:none">
      <h1>Olympiad Question Bank</h1>
      <div class="filters" id="topicFilters">
        <button class="filter-btn active" data-topic="all">All Topics</button>
        <button class="filter-btn" data-topic="Mechanics">Mechanics</button>
        <button class="filter-btn" data-topic="Electricity">Electricity</button>
        <button class="filter-btn" data-topic="Optics">Optics</button>
        <button class="filter-btn" data-topic="Thermodynamics">Thermodynamics</button>
        <button class="filter-btn" data-topic="Modern Physics">Modern Physics</button>
      </div>
      <div class="filters" id="levelFilters">
        <button class="filter-btn active" data-level="all">All Levels</button>
        <button class="filter-btn" data-level="Beginner">Beginner</button>
        <button class="filter-btn" data-level="Intermediate">Intermediate</button>
        <button class="filter-btn" data-level="Advanced">Advanced</button>
      </div>
      <div id="questionList">Loading questions...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const info = document.getElementById("info");
    const sb = window.supabase.createClient(
      "https://dylkrvdnyefdeuxtchji.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5bGtydmRueWVmZGV1eHRjaGppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1ODgxNjEsImV4cCI6MjEwODE2NDE2MX0.cs0XsVKkoo61FwJMitjSGx3vdmYsfWpqovl7kTfgAp4"
    );

    let allQuestions = [], currentTopic = "all", currentLevel = "all";

    async function start() {
      try {
        const { data: { session }, error } = await sb.auth.getSession();
        if (error) {
          info.textContent = "Auth error: " + error.message;
          return;
        }
        if (!session) {
          info.textContent = "Not logged in. Going to login...";
          window.location.href = "/login.html";
          return;
        }
        info.style.display = "none";
        document.getElementById("app").style.display = "block";
        loadQuestions();
      } catch (e) {
        info.textContent = "Error: " + (e.message || e);
      }
    }

    async function loadQuestions() {
      const list = document.getElementById("questionList");
      try {
        const res = await fetch("/api/questions");
        const data = await res.json();
        allQuestions = data.questions || [];
        render();
      } catch (e) {
        list.textContent = "Could not load questions.";
      }
    }

    function render() {
      const list = document.getElementById("questionList");
      let filtered = allQuestions;
      if (currentTopic !== "all") filtered = filtered.filter(q => q.topic === currentTopic);
      if (currentLevel !== "all") filtered = filtered.filter(q => q.level === currentLevel);
      if (!filtered.length) {
        list.innerHTML = "<p>No questions for this filter.</p>";
        return;
      }
      list.innerHTML = filtered.map((q, idx) => {
        let options = [];
        try { options = typeof q.options === "string" ? JSON.parse(q.options) : (q.options || []); } catch(e) {}
        const opts = options.map(function(opt) {
          return '<div class="option" onclick=\'pick(this,' + q.id + ',' + JSON.stringify(String(opt)) + ',' + JSON.stringify(String(q.correct_answer)) + ')\'>' + opt + '</div>';
        }).join("");
        return '<div class="q-card" id="q' + q.id + '">' +
          '<div><span class="tag">' + q.topic + '</span><span class="tag level">' + q.level + '</span></div>' +
          '<p><b>' + (idx+1) + '.</b> ' + q.question + '</p>' + opts +
          '<button class="btn" onclick="showExp(' + q.id + ')">Show Answer</button>' +
          '<div class="explanation" id="exp' + q.id + '"><b>Answer:</b> ' + q.correct_answer + '<br><b>Explanation:</b> ' + q.explanation + '</div>' +
          '</div>';
      }).join("");
    }

    function pick(el, id, selected, correct) {
      var card = document.getElementById("q" + id);
      var opts = card.querySelectorAll(".option");
      for (var i = 0; i < opts.length; i++) {
        opts[i].style.pointerEvents = "none";
        opts[i].classList.remove("correct", "wrong");
        if (opts[i].textContent === correct) opts[i].classList.add("correct");
      }
      if (selected === correct) el.classList.add("correct");
      else el.classList.add("wrong");
      showExp(id);
    }

    function showExp(id) {
      document.getElementById("exp" + id).classList.add("show");
    }

    document.getElementById("topicFilters").onclick = function(e) {
      if (!e.target.classList.contains("filter-btn")) return;
      var btns = document.querySelectorAll("#topicFilters .filter-btn");
      for (var i=0;i<btns.length;i++) btns[i].classList.remove("active");
      e.target.classList.add("active");
      currentTopic = e.target.getAttribute("data-topic");
      render();
    };

    document.getElementById("levelFilters").onclick = function(e) {
      if (!e.target.classList.contains("filter-btn")) return;
      var btns = document.querySelectorAll("#levelFilters .filter-btn");
      for (var i=0;i<btns.length;i++) btns[i].classList.remove("active");
      e.target.classList.add("active");
      currentLevel = e.target.getAttribute("data-level");
      render();
    };

    start();
  </script>
</body>
</html>
