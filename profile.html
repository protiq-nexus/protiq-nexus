<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | ProtiQ Nexus</title>
  <style>
    body { margin:0; background:#080d19; color:#f2f6ff; font-family:Arial,sans-serif; }
    a { color:inherit; text-decoration:none; }
    header { border-bottom:1px solid #24334a; }
    nav { max-width:1100px; margin:auto; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; }
    .logo { font-weight:800; } .logo span { color:#54ead5; }
    .navlinks a { color:#a1b0c8; margin-left:14px; font-size:13px; }
    .navlinks a.active { color:#54ead5; }
    .wrap { max-width:700px; margin:auto; padding:40px 20px; }
    .card { background:#101a2b; border:1px solid #24334a; border-radius:16px; padding:28px; text-align:center; }
    .avatar { width:72px; height:72px; border-radius:50%; margin:0 auto 16px; background:linear-gradient(135deg,#347cf0,#24b8b0); display:grid; place-items:center; font-size:28px; font-weight:800; color:#06101b; }
    .btn { display:inline-block; margin-top:14px; padding:10px 16px; border-radius:9px; border:0; cursor:pointer; background:linear-gradient(100deg,#347cf0,#24b8b0); color:#06101b; font-weight:800; }
    .btn2 { background:transparent; border:1px solid #24334a; color:#f2f6ff; }
    #status { color:#a1b0c8; font-size:14px; margin-top:10px; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a class="logo" href="/">ProtiQ<span> Labs</span></a>
      <div class="navlinks">
        <a href="/">Home</a>
        <a href="/olympiad.html">Olympiad</a>
        <a href="/research.html">Research</a>
        <a href="/ai.html">AI</a>
        <a href="/profile.html" class="active">Profile</a>
      </div>
    </nav>
  </header>

  <div class="wrap">
    <h1>Profile</h1>
    <div class="card">
      <div class="avatar" id="av">?</div>
      <h2 id="name">Checking...</h2>
      <p id="email" style="color:#a1b0c8"></p>
      <div id="status">Loading session...</div>
      <div id="actions"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = window.supabase.createClient(
      "https://dylkrvdnyefdeuxtchji.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5bGtydmRueWVmZGV1eHRjaGppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1ODgxNjEsImV4cCI6MjEwODE2NDE2MX0.cs0XsVKkoo61FwJMitjSGx3vdmYsfWpqovl7kTfgAp4"
    );

    async function load() {
      const { data: { session }, error } = await sb.auth.getSession();
      const name = document.getElementById("name");
      const email = document.getElementById("email");
      const status = document.getElementById("status");
      const actions = document.getElementById("actions");
      const av = document.getElementById("av");

      if (error) {
        status.textContent = "Error: " + error.message;
        return;
      }

      if (!session) {
        name.textContent = "Guest";
        email.textContent = "";
        status.textContent = "Not logged in";
        av.textContent = "?";
        actions.innerHTML = '<a class="btn" href="/login.html">Login / Sign up</a>';
        return;
      }

      const em = session.user.email || "User";
      name.textContent = em.split("@")[0];
      email.textContent = em;
      status.textContent = "Logged in · Free plan";
      av.textContent = em.charAt(0).toUpperCase();
      actions.innerHTML = '<button class="btn btn2" id="out">Logout</button>';
      document.getElementById("out").onclick = async function () {
        await sb.auth.signOut();
        window.location.href = "/login.html";
      };
    }

    load();
  </script>
</body>
</html>
