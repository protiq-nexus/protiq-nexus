<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friends | ProtiQ Nexus</title>
  <link rel="icon" href="/logo.png" type="image/png">
  <style>
    :root {
      --bg:#080d19; --panel:#101a2b; --text:#f2f6ff; --muted:#a1b0c8;
      --cyan:#54ead5; --border:#24334a; --danger:#ff6b6b;
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Arial,sans-serif; }
    a { color:inherit; text-decoration:none; }
    header { border-bottom:1px solid var(--border); }
    nav { max-width:900px; margin:auto; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; }
    .brand img { width:36px; height:36px; border-radius:50%; }
    .brand span { color:var(--cyan); }
    .navlinks a { color:var(--muted); margin-left:12px; font-size:13px; }
    .navlinks a.active { color:var(--cyan); }
    main { max-width:900px; margin:auto; padding:24px 20px; }
    h1 { margin:0 0 8px; }
    .sub { color:var(--muted); margin-bottom:16px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    input {
      flex:1; min-width:180px; padding:12px; border-radius:10px;
      border:1px solid var(--border); background:#0a1120; color:var(--text);
    }
    .btn {
      padding:10px 14px; border:0; border-radius:9px; cursor:pointer; font-weight:800;
      background:linear-gradient(100deg,#347cf0,#24b8b0); color:#06101b;
    }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .btn2 { background:transparent; border:1px solid var(--border); color:var(--text); }
    .card {
      background:var(--panel); border:1px solid var(--border); border-radius:12px;
      padding:12px 14px; margin-bottom:8px; display:flex; justify-content:space-between; gap:10px; align-items:center;
    }
    .muted { color:var(--muted); font-size:13px; }
    .err { color:var(--danger); }
    .ok { color:var(--cyan); }
    h2 { font-size:16px; margin:22px 0 10px; color:var(--cyan); }
    #msg { min-height:20px; margin:6px 0 10px; font-size:14px; }
    .tag { color:var(--muted); font-size:13px; border:1px solid var(--border); border-radius:999px; padding:6px 12px; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a class="brand" href="/"><img src="/logo.png" alt=""> ProtiQ<span> Nexus</span></a>
      <div class="navlinks">
        <a href="/">Home</a>
        <a href="/olympiad.html">Olympiad</a>
        <a href="/leaderboard.html">Leaderboard</a>
        <a href="/friends.html" class="active">Friends</a>
        <a href="/research.html">Research</a>
        <a href="/ai.html">AI</a>
        <a href="/profile.html">Profile</a>
      </div>
    </nav>
  </header>
  <main>
    <h1>Friends</h1>
    <p class="sub">Search players by name, send requests, and connect. Players who have not chosen a name appear as Player #1234.</p>
    <div id="status" class="muted">Checking login...</div>

    <div id="app" style="display:none">
      <div class="row">
        <input id="q" type="text" placeholder="Search by player name (at least 2 letters)" maxlength="60">
        <button class="btn" type="button" id="searchBtn">Search</button>
      </div>
      <div id="msg"></div>
      <div id="searchList"></div>

      <h2>Requests</h2>
      <div id="pendingList" class="muted">None</div>

      <h2>Your friends</h2>
      <div id="friendList" class="muted">None yet</div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = window.supabase.createClient(
      "https://dylkrvdnyefdeuxtchji.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5bGtydmRueWVmZGV1eHRjaGppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1ODgxNjEsImV4cCI6MjEwODE2NDE2MX0.cs0XsVKkoo61FwJMitjSGx3vdmYsfWpqovl7kTfgAp4"
    );

    function $(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function say(text, isErr) {
      const m = $("msg");
      m.textContent = text || "";
      m.className = isErr ? "err" : "ok";
    }

    // the login token tells the server who you are (the page never sends an email)
    async function authHeaders(extra) {
      const h = extra || {};
      const r = await sb.auth.getSession();
      if (r.data.session) h["Authorization"] = "Bearer " + r.data.session.access_token;
      return h;
    }
    async function readJson(res) {
      try { return await res.json(); }
      catch (e) { return { error: "The server is not ready. Please try again in a moment." }; }
    }
    async function apiGet(action, extra) {
      const res = await fetch("/api/connect?action=" + action + (extra || ""), { headers: await authHeaders() });
      const j = await readJson(res);
      if (!res.ok) throw new Error(j.error || "Failed");
      return j;
    }
    async function apiPost(payload) {
      const res = await fetch("/api/connect", {
        method: "POST",
        headers: await authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify(payload)
      });
      const j = await readJson(res);
      if (!res.ok) throw new Error(j.error || "Failed");
      return j;
    }

    function playerCard(name, points, buttons) {
      return '<div class="card"><div><b>' + esc(name) + '</b><div class="muted">' + esc(points || 0) + ' pts</div></div><div>' + buttons + '</div></div>';
    }

    async function loadPending() {
      const box = $("pendingList");
      try {
        const reqs = (await apiGet("pending")).requests || [];
        if (!reqs.length) { box.innerHTML = "<span class='muted'>No pending requests</span>"; return; }
        box.innerHTML = reqs.map(function (r) {
          return playerCard(r.display_name, r.points,
            '<button class="btn" data-accept="' + esc(r.from_key) + '">Accept</button> ' +
            '<button class="btn btn2" data-reject="' + esc(r.from_key) + '">Reject</button>');
        }).join("");
      } catch (e) { box.innerHTML = '<span class="err">' + esc(e.message) + '</span>'; }
    }

    async function loadFriends() {
      const box = $("friendList");
      try {
        const friends = (await apiGet("list")).friends || [];
        if (!friends.length) { box.innerHTML = "<span class='muted'>No friends yet</span>"; return; }
        box.innerHTML = friends.map(function (f) { return playerCard(f.display_name, f.points, ""); }).join("");
      } catch (e) { box.innerHTML = '<span class="err">' + esc(e.message) + '</span>'; }
    }

    async function search() {
      const q = $("q").value.trim();
      const box = $("searchList");
      say("");
      if (q.length < 2) { say("Type at least 2 letters of the player name.", true); return; }
      box.innerHTML = "<span class='muted'>Searching...</span>";
      try {
        const users = (await apiGet("search", "&q=" + encodeURIComponent(q))).users || [];
        if (!users.length) { box.innerHTML = "<span class='muted'>No players found. Only players with leaderboard activity can be found.</span>"; return; }
        box.innerHTML = users.map(function (u) {
          let btn;
          if (u.state === "friends") btn = '<span class="tag">Friends</span>';
          else if (u.state === "sent") btn = '<span class="tag">Request sent</span>';
          else if (u.state === "incoming") btn = '<button class="btn" data-accept="' + esc(u.key) + '">Accept</button>';
          else btn = '<button class="btn" data-request="' + esc(u.key) + '">Connect</button>';
          return playerCard(u.display_name, u.points, btn);
        }).join("");
      } catch (e) { box.innerHTML = ""; say(e.message || String(e), true); }
    }

    $("searchBtn").onclick = search;
    $("q").addEventListener("keydown", function (e) { if (e.key === "Enter") search(); });

    document.body.addEventListener("click", async function (e) {
      const btn = e.target.closest("button[data-request], button[data-accept], button[data-reject]");
      if (!btn) return;
      btn.disabled = true;
      try {
        if (btn.hasAttribute("data-request")) {
          const r = await apiPost({ action: "request", target: btn.getAttribute("data-request") });
          say(r.message || "Done");
          btn.outerHTML = '<span class="tag">' + (r.state === "friends" ? "Friends" : "Request sent") + '</span>';
          if (r.state === "friends") { loadPending(); loadFriends(); }
        } else if (btn.hasAttribute("data-accept")) {
          const r = await apiPost({ action: "accept", target: btn.getAttribute("data-accept") });
          say(r.message || "Done");
          loadPending(); loadFriends();
        } else {
          const r = await apiPost({ action: "reject", target: btn.getAttribute("data-reject") });
          say(r.message || "Done");
          loadPending();
        }
      } catch (err) {
        btn.disabled = false;
        say(err.message || String(err), true);
      }
    });

    (async function () {
      const status = $("status");
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (!session) {
          status.textContent = "Login required. Redirecting...";
          window.location.href = "/login.html?next=/friends.html";
          return;
        }
        status.style.display = "none";
        $("app").style.display = "block";
        loadPending();
        loadFriends();
      } catch (e) {
        status.className = "err";
        status.textContent = e.message || String(e);
      }
    })();
  </script>
</body>
</html>
