<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ProtiQ Nexus</title>
  <style>
    body { margin:0; background:#080d19; color:#f2f6ff; font-family:Arial,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
    a { color:#54ead5; text-decoration:none; }
    header { border-bottom:1px solid #24334a; padding:14px 20px; }
    main { flex:1; display:grid; place-items:center; padding:40px 16px; }
    .card { width:100%; max-width:420px; background:#101a2b; border:1px solid #24334a; border-radius:16px; padding:28px; }
    h1 { margin:0 0 8px; }
    .sub { color:#a1b0c8; font-size:14px; margin-bottom:20px; }
    .tabs { display:flex; gap:8px; margin-bottom:16px; }
    .tab { flex:1; padding:10px; border-radius:9px; border:1px solid #24334a; background:transparent; color:#a1b0c8; cursor:pointer; }
    .tab.on { border-color:#54ead5; color:#54ead5; }
    label { display:block; font-size:13px; color:#a1b0c8; margin:0 0 6px; }
    input { width:100%; padding:12px; margin-bottom:12px; border:1px solid #24334a; border-radius:9px; background:#0a1120; color:#fff; box-sizing:border-box; }
    .btn { width:100%; padding:12px; border:0; border-radius:9px; cursor:pointer; background:linear-gradient(100deg,#347cf0,#24b8b0); color:#06101b; font-weight:800; }
    .msg { margin-top:14px; font-size:14px; color:#54ead5; white-space:pre-wrap; }
    .err { color:#ff6b6b; }
    .box { display:none; }
    .box.on { display:block; }
  </style>
</head>
<body>
  <header><a href="/">ProtiQ Labs</a></header>
  <main>
    <div class="card">
      <h1>Welcome</h1>
      <p class="sub">Sign up or login to continue</p>
      <div class="tabs">
        <button class="tab on" id="bLogin" type="button">Login</button>
        <button class="tab" id="bSignup" type="button">Sign up</button>
      </div>

      <div class="box on" id="loginBox">
        <label>Email</label>
        <input id="loginEmail" type="email" placeholder="you@email.com">
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="min 6 chars">
        <button class="btn" type="button" id="loginBtn">Login</button>
      </div>

      <div class="box" id="signupBox">
        <label>Email</label>
        <input id="signupEmail" type="email" placeholder="you@email.com">
        <label>Password</label>
        <input id="signupPassword" type="password" placeholder="min 6 chars">
        <button class="btn" type="button" id="signupBtn">Create account</button>
      </div>

      <div class="msg" id="msg"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const msg = document.getElementById("msg");
    function show(t, isErr) {
      msg.textContent = t;
      msg.className = isErr ? "msg err" : "msg";
    }

    document.getElementById("bLogin").onclick = function () {
      document.getElementById("bLogin").classList.add("on");
      document.getElementById("bSignup").classList.remove("on");
      document.getElementById("loginBox").classList.add("on");
      document.getElementById("signupBox").classList.remove("on");
      show("");
    };
    document.getElementById("bSignup").onclick = function () {
      document.getElementById("bSignup").classList.add("on");
      document.getElementById("bLogin").classList.remove("on");
      document.getElementById("signupBox").classList.add("on");
      document.getElementById("loginBox").classList.remove("on");
      show("");
    };

    let supabase = null;
    try {
      if (!window.supabase) throw new Error("Supabase library failed to load");
      supabase = window.supabase.createClient(
        "https://dylkrvdnyefdeuxtchji.supabase.co",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5bGtydmRueWVmZGV1eHRjaGppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1ODgxNjEsImV4cCI6MjEwODE2NDE2MX0.cs0XsVKkoo61FwJMitjSGx3vdmYsfWpqovl7kTfgAp4"
      );
      show("Ready. Choose Login or Sign up.");
    } catch (e) {
      show("Setup error: " + e.message, true);
    }

    document.getElementById("signupBtn").onclick = async function () {
      try {
        if (!supabase) throw new Error("Supabase not ready");
        const email = document.getElementById("signupEmail").value.trim();
        const password = document.getElementById("signupPassword").value;
        if (!email || password.length < 6) throw new Error("Email required & password min 6 chars");
        show("Creating account...");
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        show("Account created! Now go to Login tab and sign in.");
        document.getElementById("bLogin").click();
      } catch (e) {
        show("Sign up failed: " + (e.message || e), true);
      }
    };

    document.getElementById("loginBtn").onclick = async function () {
      try {
        if (!supabase) throw new Error("Supabase not ready");
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;
        if (!email || !password) throw new Error("Enter email and password");
        show("Signing in...");
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        show("Success! Going to profile...");
        window.location.href = "/profile.html";
      } catch (e) {
        show("Login failed: " + (e.message || e), true);
      }
    };
  </script>
</body>
</html>
