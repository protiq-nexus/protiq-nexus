<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ProtiQ Nexus</title>
  <link rel="icon" href="/logo.png" type="image/png">
  <style>
    :root {
      --bg:#080d19; --panel:#101a2b; --text:#f2f6ff; --muted:#a1b0c8;
      --cyan:#54ead5; --border:#24334a; --danger:#ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: Arial, sans-serif; display: grid; place-items: center; padding: 20px;
    }
    .card {
      width: 100%; max-width: 400px; background: var(--panel);
      border: 1px solid var(--border); border-radius: 16px; padding: 28px;
    }
    .brand { text-align: center; margin-bottom: 18px; }
    .brand img { width: 64px; height: 64px; border-radius: 50%; }
    h1 { margin: 10px 0 4px; font-size: 22px; text-align: center; }
    .sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 18px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab {
      flex: 1; padding: 10px; border-radius: 9px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); cursor: pointer; font-weight: 700;
    }
    .tab.active { border-color: var(--cyan); color: var(--cyan); }
    label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 6px; }
    input {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
      background: #0a1120; color: var(--text); outline: none;
    }
    .btn {
      width: 100%; margin-top: 16px; padding: 12px; border: 0; border-radius: 10px;
      cursor: pointer; font-weight: 800;
      background: linear-gradient(100deg, #347cf0, #24b8b0); color: #06101b;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn2 {
      width: 100%; margin-top: 10px; padding: 10px; border-radius: 10px; cursor: pointer;
      background: transparent; border: 1px solid var(--border); color: var(--text); font-weight: 700;
    }
    .btn2:disabled { opacity: .5; cursor: not-allowed; }
    #code { text-align: center; font-size: 22px; letter-spacing: 6px; }
    #msg { margin-top: 12px; font-size: 13px; color: var(--cyan); min-height: 18px; }
    #msg.err { color: var(--danger); }
    .hidden { display: none; }
    a { color: var(--cyan); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="/logo.png" alt="ProtiQ">
      <h1>ProtiQ Nexus</h1>
      <div class="sub">Sign in to join the leaderboard and save your profile</div>
    </div>

    <div class="tabs" id="tabs">
      <button type="button" class="tab active" id="tabLogin">Login</button>
      <button type="button" class="tab" id="tabSignup">Sign up</button>
    </div>

    <form id="form" autocomplete="on">
      <label>Email</label>
      <input id="email" type="email" required placeholder="you@email.com">
      <label>Password</label>
      <input id="password" type="password" required minlength="6" placeholder="At least 6 characters">
      <button class="btn" type="submit" id="submitBtn">Login</button>
    </form>

    <!-- NEW: 6-digit verification code box -->
    <div id="verifyBox" class="hidden">
      <label>6-digit verification code</label>
      <input id="code" type="text" inputmode="numeric" maxlength="10" autocomplete="one-time-code" placeholder="------">
      <button class="btn" type="button" id="verifyBtn">Verify</button>
      <button class="btn2" type="button" id="backBtn">← Back to login</button>
    </div>

    <button type="button" class="btn2 hidden" id="resendBtn">Resend verification email</button>
    <div id="msg"></div>
    <p class="sub" style="margin-top:16px"><a href="/">← Back to Home</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = window.supabase.createClient(
      "https://dylkrvdnyefdeuxtchji.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5bGtydmRueWVmZGV1eHRjaGppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1ODgxNjEsImV4cCI6MjEwODE2NDE2MX0.cs0XsVKkoo61FwJMitjSGx3vdmYsfWpqovl7kTfgAp4"
    );

    // NEW: after login, go back to the page the user came from (?next=/olympiad.html)
    function getNext() {
      try {
        const n = new URLSearchParams(window.location.search).get("next");
        if (n && n.charAt(0) === "/" && n.charAt(1) !== "/" && n.indexOf("\\") === -1) return n;
      } catch (e) {}
      return "/profile.html";
    }

    let mode = "login"; // login | signup
    const msg = document.getElementById("msg");
    const resendBtn = document.getElementById("resendBtn");
    const submitBtn = document.getElementById("submitBtn");
    // NEW elements
    const formEl = document.getElementById("form");
    const tabsEl = document.getElementById("tabs");
    const verifyBox = document.getElementById("verifyBox");
    const verifyBtn = document.getElementById("verifyBtn");
    const backBtn = document.getElementById("backBtn");
    let pendingEmail = "";

    function setMsg(text, isErr) {
      msg.textContent = text || "";
      msg.className = isErr ? "err" : "";
    }

    // NEW: show / hide the code box
    function showVerify(email) {
      pendingEmail = email;
      formEl.classList.add("hidden");
      tabsEl.classList.add("hidden");
      verifyBox.classList.remove("hidden");
      resendBtn.classList.remove("hidden");
      document.getElementById("code").value = "";
    }
    function hideVerify() {
      verifyBox.classList.add("hidden");
      formEl.classList.remove("hidden");
      tabsEl.classList.remove("hidden");
    }

    function setMode(next) {
      mode = next;
      hideVerify();
      document.getElementById("tabLogin").classList.toggle("active", mode === "login");
      document.getElementById("tabSignup").classList.toggle("active", mode === "signup");
      submitBtn.textContent = mode === "login" ? "Login" : "Sign up";
      resendBtn.classList.toggle("hidden", mode !== "signup");
      setMsg("");
    }

    document.getElementById("tabLogin").onclick = function () { setMode("login"); };
    document.getElementById("tabSignup").onclick = function () { setMode("signup"); };

    // Email confirm link থেকে এলে session অটো নেয় → সরাসরি ভিতরে
    (async function boot() {
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (session) {
          setMsg("Already signed in. Redirecting...");
          window.location.replace(getNext());
          return;
        }
        // URL-এ auth tokens থাকলে detect
        sb.auth.onAuthStateChange(function (event, session) {
          if (session && (event === "SIGNED_IN" || event === "INITIAL_SESSION")) {
            window.location.replace(getNext());
          }
        });
      } catch (e) {
        setMsg(e.message || String(e), true);
      }
    })();

    document.getElementById("form").onsubmit = async function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      setMsg(mode === "login" ? "Logging in..." : "Creating account...");
      submitBtn.disabled = true;
      try {
        if (mode === "signup") {
          const { data, error } = await sb.auth.signUp({
            email,
            password,
            options: {
              emailRedirectTo: "https://protiq-nexus.pages.dev/profile.html"
            }
          });
          if (error) throw error;
          if (data.session) {
            setMsg("Account created. Redirecting...");
            window.location.replace(getNext());
            return;
          }
          // NEW: email already registered
          if (data.user && data.user.identities && data.user.identities.length === 0) {
            setMsg("This email is already registered. Please login.", true);
            return;
          }
          // CHANGED: show the code box (the email link still works too)
          showVerify(email);
          setMsg("Verification email sent. Enter the 6-digit code below, or click the link in the email. Check Spam too.");
        } else {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
          setMsg("Success. Redirecting...");
          window.location.replace(getNext());
        }
      } catch (err) {
        const m = (err.message || "").toLowerCase();
        // NEW: unverified user gets the code box
        if (mode === "login" && m.indexOf("not confirmed") !== -1) {
          showVerify(email);
          setMsg("Your email is not verified yet. Enter the code we sent, or tap Resend.", true);
        } else {
          setMsg(err.message || String(err), true);
        }
      } finally {
        submitBtn.disabled = false;
      }
    };

    // NEW: check the 6-digit code
    verifyBtn.onclick = async function () {
      const code = document.getElementById("code").value.trim();
      if (!/^\d{6,10}$/.test(code)) {
        setMsg("Enter the code from your email.", true);
        return;
      }
      setMsg("Verifying...");
      verifyBtn.disabled = true;
      try {
        const { error } = await sb.auth.verifyOtp({ email: pendingEmail, token: code, type: "signup" });
        if (error) throw error;
        setMsg("Email verified. Redirecting...");
        window.location.replace(getNext());
      } catch (err) {
        setMsg(err.message || String(err), true);
      } finally {
        verifyBtn.disabled = false;
      }
    };

    // NEW: back to login
    backBtn.onclick = function () {
      pendingEmail = "";
      setMode("login");
    };

    // Resend (now with a 60 second wait so the email limit is not used up)
    let cooldownTimer = null;
    resendBtn.onclick = async function () {
      if (resendBtn.disabled) return;
      const email = pendingEmail || document.getElementById("email").value.trim();
      if (!email) {
        setMsg("Enter your email first.", true);
        return;
      }
      setMsg("Sending verification email...");
      try {
        const { error } = await sb.auth.resend({
          type: "signup",
          email,
          options: {
            emailRedirectTo: "https://protiq-nexus.pages.dev/profile.html"
          }
        });
        if (error) throw error;
        setMsg("Verification email resent. Check inbox and Spam.");
        let left = 60;
        resendBtn.disabled = true;
        resendBtn.textContent = "Resend in " + left + "s";
        clearInterval(cooldownTimer);
        cooldownTimer = setInterval(function () {
          left--;
          if (left <= 0) {
            clearInterval(cooldownTimer);
            resendBtn.disabled = false;
            resendBtn.textContent = "Resend verification email";
          } else {
            resendBtn.textContent = "Resend in " + left + "s";
          }
        }, 1000);
      } catch (err) {
        setMsg(err.message || String(err), true);
      }
    };
  </script>
</body>
</html>
