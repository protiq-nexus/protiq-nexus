<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ProtiQ Nexus</title>
  <style>
    body { margin:0; background:#080d19; color:#f2f6ff; font-family:Arial,sans-serif; }
    a { color:#54ead5; text-decoration:none; }
    header { padding:14px 20px; border-bottom:1px solid #24334a; }
    main { max-width:420px; margin:40px auto; padding:0 16px; }
    .card { background:#101a2b; border:1px solid #24334a; border-radius:16px; padding:28px; }
    h1 { margin:0 0 6px; }
    .sub { color:#a1b0c8; font-size:14px; margin:0 0 16px; }
    .tabs { display:flex; gap:8px; margin-bottom:16px; }
    .tab { flex:1; padding:10px; border-radius:9px; border:1px solid #24334a; background:transparent; color:#a1b0c8; cursor:pointer; }
    .tab.active { border-color:#54ead5; color:#54ead5; }
    label { display:block; font-size:13px; color:#a1b0c8; margin-bottom:6px; }
    input { width:100%; box-sizing:border-box; padding:12px; margin-bottom:12px; border:1px solid #24334a; border-radius:9px; background:#0a1120; color:#fff; }
    .btn { width:100%; padding:12px; border:0; border-radius:9px; cursor:pointer; background:linear-gradient(100deg,#347cf0,#24b8b0); color:#06101b; font-weight:800; }
    #msg { margin-top:14px; font-size:14px; color:#54ead5; }
    .err { color:#ff6b6b !important; }
  </style>
</head>
<body>
  <header><a href="/">← Home</a></header>
  <main>
    <div class="card">
      <h1 id="title">Login</h1>
      <p class="sub" id="sub">Account thakle login koro</p>

      <div class="tabs">
        <button type="button" class="tab active" id="tabL" onclick="showLogin()">Login</button>
        <button type="button" class="tab" id="tabS" onclick="showSignup()">Sign up</button>
      </div>

      <div id="loginBox">
        <label>Email</label>
        <input id="le" type="email" placeholder="you@email.com">
        <label>Password</label>
        <input id="lp" type="password" placeholder="password">
        <button type="button" class="btn" onclick="doLogin()">Login now</button>
      </div>

      <div id="signupBox" style="display:none">
        <label>Email</label>
        <input id="se" type="email" placeholder="new@email.com">
        <label>Password (min 6)</label>
        <input id="sp" type="password" placeholder="new password">
        <button type="button" class="btn" onclick="doSignup()">Create account</button>
      </div>

      <div id="msg"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    function showLogin() {
      document.getElementById("loginBox").style.display = "block";
      document.getElementById("signupBox").style.display = "none";
      document.getElementById("tabL").classList.add("active");
      document.getElementById("tabS").classList.remove("active");
      document.getElementById("title").innerText = "Login";
      document.getElementById("sub").innerText = "Account thakle login koro";
      document.getElementById("msg").innerText = "";
    }

    function showSignup() {
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("signupBox").style.display = "block";
      document.getElementById("tabS").classList.add("active");
      document.getElementById("tabL").classList.remove("active");
      document.getElementById("title").innerText = "Sign up";
      document.getElementById("sub").innerText = "Notun account banao";
      document.getElementById("msg").innerText = "Signup form open";
      document.getElementById("msg").className = "";
    }

    function getSB() {
      return window.supabase.createClient(
        "https://dylkrvdnyefdeuxtchji.supabase.co",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5bGtydmRueWVmZGV1eHRjaGppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1ODgxNjEsImV4cCI6MjEwODE2NDE2MX0.cs0XsVKkoo61FwJMitjSGx3vdmYsfWpqovl7kTfgAp4"
      );
    }

    async function doSignup() {
      var msg = document.getElementById("msg");
      try {
        var email = document.getElementById("se").value.trim();
        var password = document.getElementById("sp").value;
        if (!email) { msg.innerText = "Email dao"; msg.className = "err"; return; }
        if (password.length < 6) { msg.innerText = "Password min 6"; msg.className = "err"; return; }
        msg.className = "";
        msg.innerText = "Creating...";
        var { error } = await getSB().auth.signUp({ email: email, password: password });
        if (error) { msg.innerText = error.message; msg.className = "err"; return; }
        msg.innerText = "Account created! Login tab e giye sign in koro.";
        showLogin();
      } catch (e) {
        msg.innerText = String(e.message || e);
        msg.className = "err";
      }
    }

    async function doLogin() {
      var msg = document.getElementById("msg");
      try {
        var email = document.getElementById("le").value.trim();
        var password = document.getElementById("lp").value;
        if (!email || !password) { msg.innerText = "Email & password dao"; msg.className = "err"; return; }
        msg.className = "";
        msg.innerText = "Signing in...";
        var { error } = await getSB().auth.signInWithPassword({ email: email, password: password });
        if (error) { msg.innerText = error.message; msg.className = "err"; return; }
        msg.innerText = "Success!";
        window.location.href = "/profile.html";
      } catch (e) {
        msg.innerText = String(e.message || e);
        msg.className = "err";
      }
    }
  </script>
</body>
</html>
